name: rust
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  conformance:
    # The cross-impl differential: build the Rust broker, then have the Python client drive it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p casl-broker --manifest-path rust/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install z3-solver pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_broker_rust_parity.py
